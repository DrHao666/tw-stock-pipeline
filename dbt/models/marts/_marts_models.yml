version: 2

models:
  - name: dim_stock
    description: >
      股票維度表（SCD Type 2），一檔一個版本一列；期間為 [valid_from, valid_to)。
      名稱、市場取自每日行情，證券類別、產業別取自 ISIN 快照（快照開始前用第一份補）。
      第一版從回補起始日開始；已下市股票的最後一版延到融資融券／三大法人最後出現那天的隔天。
      3 年內下市的股票保留，is_delisted = true，證券類別、產業別為 NULL。
    columns:
      - name: stock_sk
        description: 代理鍵，md5(stock_id | 版本第一筆成交日)；期間延伸不會改變它
        data_tests: [unique, not_null]
      - name: stock_id
        data_tests:
          - not_null
          - unique:
              config:
                where: "is_current"
      - name: valid_from
        data_tests: [not_null]
      - name: valid_to
        data_tests: [not_null]
      - name: market
        data_tests:
          - accepted_values:
              arguments:
                values: ['TWSE', 'TPEx']

  - name: dim_date
    description: 日期維度，一天一列，從回補起始日到明年底；is_trading_day 取自交易日曆，未抓過的日期為 NULL
    columns:
      - name: date_day
        data_tests: [unique, not_null]

  - name: fact_daily_price
    description: 每日行情，一天一檔一列；原始與還原 OHLC 並列，每次整張重建
    data_tests:
      - unique:
          column_name: "trade_date || '-' || stock_id"
    columns:
      - name: trade_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: stock_sk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_stock')
                field: stock_sk

  - name: fact_institutional
    description: 三大法人買賣超，一天一檔一列，單位為股
    data_tests:
      - unique:
          column_name: "trade_date || '-' || stock_id"
    columns:
      - name: trade_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: stock_sk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_stock')
                field: stock_sk

  - name: fact_margin
    description: 融資融券，一天一檔一列，單位為張
    data_tests:
      - unique:
          column_name: "trade_date || '-' || stock_id"
    columns:
      - name: trade_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: stock_sk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_stock')
                field: stock_sk

  - name: fact_shareholding
    description: 集保股權分散表，一週一檔一個持股分級一列，單位為股
    data_tests:
      - unique:
          column_name: "data_date || '-' || stock_id || '-' || level"
    columns:
      - name: data_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: stock_sk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_stock')
                field: stock_sk

  - name: indicators
    description: 技術指標，一天一檔一列（只含有成交的日子）；均線、均量、N 日高低都用還原價與還原成交量，視窗資料不足 N 天時為 NULL
    data_tests:
      - unique:
          column_name: "trade_date || '-' || stock_id"
    columns:
      - name: trade_date
        data_tests: [not_null]
      - name: stock_sk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_stock')
                field: stock_sk
      - name: ma5
        description: 最近 5 個有成交日的還原收盤均價
      - name: vol_ma5
        description: 最近 5 個有成交日的還原成交股數均量
      - name: high_20
        description: 最近 20 個有成交日的還原最高價

  - name: signals
    description: K 線型態（紅三兵、黃昏之星、烏雲蓋頂）與趨勢狀態，一天一檔一列，和 indicators 同樣只含有成交的日子；門檻見 config/signal_thresholds.csv
    data_tests:
      - unique:
          column_name: "trade_date || '-' || stock_id"
    columns:
      - name: stock_sk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_stock')
                field: stock_sk
      - name: three_white_soldiers
        data_tests: [not_null]
      - name: evening_star
        data_tests: [not_null]
      - name: dark_cloud_cover
        data_tests: [not_null]
      - name: trend_state
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['breakout', 'pullback', 'range', 'none']

  - name: forward_returns
    description: 每檔每天的未來報酬（隔天開盤買進，持有 5、20 個有成交日收盤賣出，還原價），只含個股；最近的日子為 NULL
    data_tests:
      - unique:
          column_name: "trade_date || '-' || stock_id"
    columns:
      - name: stock_sk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_stock')
                field: stock_sk

  - name: backtest_results
    description: 回測結果，每種訊號 × 持有天數一列；基準為所有股票所有日子的平均報酬，超額報酬扣除同日平均
    data_tests:
      - unique:
          column_name: "signal || '-' || horizon_days"
    columns:
      - name: signal
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['three_white_soldiers', 'evening_star', 'dark_cloud_cover', 'breakout', 'pullback']
      - name: horizon_days
        data_tests:
          - accepted_values:
              arguments:
                values: [5, 20]

  - name: stock_summary
    description: 個股摘要，一檔一列（dim_stock 目前版本），最後一個有成交日的價格、指標、趨勢，近 5 個有成交日的訊號與每種訊號最近一次出現的日期；Dashboard 直接查這張
    columns:
      - name: stock_id
        data_tests: [unique, not_null]
      - name: last_trade_date
        data_tests: [not_null]
      - name: is_common_stock
        data_tests: [not_null]
