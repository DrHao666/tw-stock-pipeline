version: 2

models:
  - name: dim_stock
    description: >
      股票維度表（SCD Type 2），一檔一個版本一列；期間為 [valid_from, valid_to)。
      名稱、市場取自每日行情，證券類別、產業別取自 ISIN 快照（快照開始前用第一份補）。
      3 年內下市的股票保留，is_delisted = true，證券類別、產業別為 NULL。
    columns:
      - name: stock_sk
        description: 代理鍵，md5(stock_id | valid_from)
        data_tests: [unique, not_null]
      - name: stock_id
        data_tests:
          - not_null
          - unique:
              config:
                where: "is_current"
      - name: valid_from
        data_tests: [not_null]
      - name: valid_to
        data_tests: [not_null]
      - name: market
        data_tests:
          - accepted_values:
              arguments:
                values: ['TWSE', 'TPEx']

  - name: dim_date
    description: 日期維度，一天一列，從回補起始日到明年底；is_trading_day 取自交易日曆，未抓過的日期為 NULL
    columns:
      - name: date_day
        data_tests: [unique, not_null]

  - name: fact_daily_price
    description: 每日行情，一天一檔一列；原始與還原 OHLC 並列，每次整張重建
    data_tests:
      - unique:
          column_name: "trade_date || '-' || stock_id"
    columns:
      - name: trade_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: stock_sk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_stock')
                field: stock_sk

  - name: fact_institutional
    description: 三大法人買賣超，一天一檔一列，單位為股
    data_tests:
      - unique:
          column_name: "trade_date || '-' || stock_id"
    columns:
      - name: trade_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: stock_sk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_stock')
                field: stock_sk

  - name: fact_margin
    description: 融資融券，一天一檔一列，單位為張
    data_tests:
      - unique:
          column_name: "trade_date || '-' || stock_id"
    columns:
      - name: trade_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: stock_sk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_stock')
                field: stock_sk

  - name: fact_shareholding
    description: 集保股權分散表，一週一檔一個持股分級一列，單位為股
    data_tests:
      - unique:
          column_name: "data_date || '-' || stock_id || '-' || level"
    columns:
      - name: data_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: stock_sk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_stock')
                field: stock_sk
