version: 2

models:
  - name: stg_twse_quotes
    description: 上市股票每日收盤行情，一天一檔一列；價格欄位沒成交時為 NULL
    data_tests:
      - unique:
          column_name: "trade_date || '-' || stock_id"
    columns:
      - name: trade_date
        data_tests: [not_null]
      - name: stock_id
        data_tests: [not_null]
      - name: volume_shares
        data_tests: [not_null]
      - name: close_price
        description: 收盤價；當天沒成交為 NULL

  - name: stg_tpex_quotes
    description: 上櫃股票每日收盤行情，一天一檔一列；價格欄位沒成交時為 NULL，沒有本益比
    data_tests:
      - unique:
          column_name: "trade_date || '-' || stock_id"
    columns:
      - name: trade_date
        data_tests: [not_null]
      - name: stock_id
        data_tests: [not_null]
      - name: volume_shares
        data_tests: [not_null]

  - name: stg_daily_quotes
    description: 上市與上櫃每日收盤行情合併，一天一檔一列；market 標示 TWSE 或 TPEx
    data_tests:
      - unique:
          column_name: "trade_date || '-' || stock_id"
    columns:
      - name: market
        data_tests:
          - accepted_values:
              arguments:
                values: ['TWSE', 'TPEx']

  - name: stg_trading_calendar
    description: 每個已抓取日期是否開市；raw 沒有的日期不在表中（代表尚未抓取）
    columns:
      - name: trade_date
        data_tests: [unique, not_null]
      - name: is_trading_day
        data_tests: [not_null]

  - name: stg_price_adjustments
    description: 除權息與減資事件，一列一個事件；factor = 參考價 / 事件前收盤價
    data_tests:
      - unique:
          column_name: "event_date || '-' || stock_id || '-' || event_type"
    columns:
      - name: event_date
        data_tests: [not_null]
      - name: stock_id
        data_tests: [not_null]
      - name: event_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['ex_rights', 'capital_reduction']
      - name: factor
        data_tests: [not_null]

  - name: stg_daily_quotes_adjusted
    description: 向後還原的每日行情；原始價與還原價並存，adj_factor 為該日適用的累積係數
    data_tests:
      - unique:
          column_name: "trade_date || '-' || stock_id"
    columns:
      - name: adj_factor
        data_tests: [not_null]

  - name: stg_institutional_trades
    description: 上市、上櫃三大法人買賣超，一天一檔一列，單位為股；net 欄位正數為買超、負數為賣超
    data_tests:
      - unique:
          column_name: "trade_date || '-' || stock_id"
    columns:
      - name: trade_date
        data_tests: [not_null]
      - name: stock_id
        data_tests: [not_null]
      - name: total_net
        data_tests: [not_null]
      - name: market
        data_tests:
          - accepted_values:
              arguments:
                values: ['TWSE', 'TPEx']
  - name: stg_margin_trades
    description: 上市、上櫃融資融券，一天一檔一列，單位為張；note 為來源註記（停資、停券等符號），沒有時為 NULL
    data_tests:
      - unique:
          column_name: "trade_date || '-' || stock_id"
    columns:
      - name: trade_date
        data_tests: [not_null]
      - name: stock_id
        data_tests: [not_null]
      - name: margin_balance
        data_tests: [not_null]
      - name: short_balance
        data_tests: [not_null]
      - name: market
        data_tests:
          - accepted_values:
              arguments:
                values: ['TWSE', 'TPEx']
  - name: stg_shareholding_distribution
    description: 集保股權分散表，一週一檔一個持股分級一列，單位為股；分級 1-15 為級距、16 差異數調整、17 合計
    data_tests:
      - unique:
          column_name: "data_date || '-' || stock_id || '-' || level"
    columns:
      - name: data_date
        data_tests: [not_null]
      - name: stock_id
        data_tests: [not_null]
      - name: level
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('tdcc_holding_levels')
                field: level
      - name: holders
        data_tests: [not_null]
      - name: shares
        data_tests: [not_null]
