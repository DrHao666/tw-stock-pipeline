version: 2

sources:
  - name: raw
    description: ingestion/ 抓下來的原始回應，原封不動保存
    schema: raw
    tables:
      - name: twse_mi_index
        description: 證交所（上市）MI_INDEX 每日回應，每個日期一筆，休市日 stat 不是 'OK'
        columns:
          - name: trade_date
            tests: [unique, not_null]
      - name: tpex_otc_quotes
        description: 櫃買中心（上櫃）每日收盤行情回應，每個日期一筆，休市日 data 為空陣列
        columns:
          - name: trade_date
            tests: [unique, not_null]
      - name: twse_ex_rights
        description: 證交所 TWT49U 除權除息計算結果表，每月一筆
        columns:
          - name: period_start
            tests: [unique, not_null]
      - name: twse_capital_reduction
        description: 證交所 TWTAUU 減資恢復買賣參考價，每月一筆；當月沒有減資時 stat 不是 'OK'
        columns:
          - name: period_start
            tests: [unique, not_null]
      - name: tpex_ex_rights
        description: 櫃買中心 exDailyQ 除權除息計算結果表，每月一筆
        columns:
          - name: period_start
            tests: [unique, not_null]
      - name: tpex_capital_reduction
        description: 櫃買中心 revivt 減資恢復買賣參考價，每月一筆
        columns:
          - name: period_start
            tests: [unique, not_null]
      - name: twse_par_value_change
        description: 證交所 TWTB8U 變更股票面額恢復買賣參考價，每月一筆；當月沒有事件時 stat 不是 'OK'
        columns:
          - name: period_start
            tests: [unique, not_null]
      - name: twse_etf_split
        description: 證交所 TWTCAU ETF 分割（反分割）恢復買賣參考價，每月一筆
        columns:
          - name: period_start
            tests: [unique, not_null]
      - name: tpex_par_value_change
        description: 櫃買中心 pvChgRslt 變更股票面額恢復買賣參考價，每月一筆
        columns:
          - name: period_start
            tests: [unique, not_null]
      - name: tpex_etf_split
        description: 櫃買中心 etfSplitRslt ETF 分割恢復買賣參考價，每月一筆
        columns:
          - name: period_start
            tests: [unique, not_null]
      - name: tpex_etf_reverse_split
        description: 櫃買中心 etfRvsRslt ETF 反分割恢復買賣參考價，每月一筆
        columns:
          - name: period_start
            tests: [unique, not_null]
      - name: twse_t86
        description: 證交所 T86 三大法人買賣超日報，每個日期一筆；休市日 stat 不是 'OK'、沒有 data
        columns:
          - name: trade_date
            tests: [unique, not_null]
      - name: tpex_insti_daily
        description: 櫃買中心三大法人日交易資訊，每個日期一筆；休市日 data 為空陣列
        columns:
          - name: trade_date
            tests: [unique, not_null]
      - name: twse_mi_margn
        description: 證交所 MI_MARGN 融資融券餘額，每個日期一筆；休市日 stat 不是 'OK'、沒有 tables
        columns:
          - name: trade_date
            tests: [unique, not_null]
      - name: tpex_margin_balance
        description: 櫃買中心融資融券餘額，每個日期一筆；休市日 data 為空陣列
        columns:
          - name: trade_date
            tests: [unique, not_null]
      - name: tdcc_shareholding
        description: 集保開放資料股權分散表，每個資料日期（每週）一筆，只從開始抓的那週往後累積
        columns:
          - name: data_date
            tests: [unique, not_null]
      - name: twse_isin
        description: 證交所 ISIN 清單解析結果（上市＋上櫃，不含權證），每天一筆快照；只從開始抓的那天往後累積
        columns:
          - name: snapshot_date
            tests: [unique, not_null]
