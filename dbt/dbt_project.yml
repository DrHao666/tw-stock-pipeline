name: tw_stock
version: "1.0.0"
config-version: 2
profile: tw_stock

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds", "../config"]
test-paths: ["tests"]

vars:
  # Start of the 3-year backfill; marts only use data from this date on (earlier rows are test samples).
  # Keep this file ASCII-only: dbt on Windows reads dbt_project.yml with the system codepage (cp950).
  history_start_date: "2023-10-19"

models:
  tw_stock:
    staging:
      +schema: staging
      +materialized: view
    marts:
      +schema: marts
      +materialized: table

seeds:
  tw_stock:
    +schema: staging
    tdcc_holding_levels:
      +column_types:
        level: integer
        level_type: text
        label: text
        min_shares: bigint
        max_shares: bigint
    signal_thresholds:
      +column_types:
        name: text
        value: numeric
        description: text
    manual_price_adjustments:
      +column_types:
        event_date: date
        stock_id: text
        market: text
        event_type: text
        prev_close: numeric
        reference_price: numeric
        source_note: text
