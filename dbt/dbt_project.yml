name: tw_stock
version: "1.0.0"
config-version: 2
profile: tw_stock

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]

models:
  tw_stock:
    staging:
      +schema: staging
      +materialized: view

seeds:
  tw_stock:
    +schema: staging
    tdcc_holding_levels:
      +column_types:
        level: integer
        level_type: text
        label: text
        min_shares: bigint
        max_shares: bigint
