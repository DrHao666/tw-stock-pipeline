name: tw_stock
version: "1.0.0"
config-version: 2
profile: tw_stock

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]

vars:
  # 3 年回補的起始日；marts 只用這天之後的資料（更早的只有測試時抓的零星日期）
  history_start_date: "2023-10-19"

models:
  tw_stock:
    staging:
      +schema: staging
      +materialized: view
    marts:
      +schema: marts
      +materialized: table

seeds:
  tw_stock:
    +schema: staging
    tdcc_holding_levels:
      +column_types:
        level: integer
        level_type: text
        label: text
        min_shares: bigint
        max_shares: bigint
